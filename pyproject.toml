[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "floorplan-to-ifc-api"
version = "2.8.0"
description = "Floor-plan image analysis and IFC4 export service."
requires-python = ">=3.11,<3.12"
dynamic = ["dependencies"]

[tool.setuptools]
py-modules = ["application", "schemas", "ocr_detector"]
packages = [
  "analysis", "config", "evaluation", "export", "image_processing", "models", "mrcnn",
  "routes", "services", "stage1_contracts", "utils", "validation", "visualization"
]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.pytest.ini_options]
# Keep Stage 1 collection isolated from the nested compliance-engine project.
# Integration calls cross the boundary through tests/_engine_modules.py.
pythonpath = [".", "tests"]
testpaths = ["tests"]
norecursedirs = ["compliance-engine", "wheels", "weights", "outputs", "artifacts", "baseline"]
addopts = "-q --strict-config --strict-markers"
markers = [
  "unit: Stage-1 tests that do not require the compliance engine",
  "integration: Stage-1 to compliance-engine contract tests",
  "artifact: tests that require external model or wheel artifacts",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
  "compliance-engine",
  "mrcnn",
  "notebooks",
  "outputs",
  "artifacts",
  "baseline",
]

[tool.ruff.lint]
# Final release: correctness and release-safety findings are blocking.
select = ["E9", "F63", "F7", "F82"]
